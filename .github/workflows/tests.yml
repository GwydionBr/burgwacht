# Führt tools/test.sh (Tests und Rauchtest) bei jedem Pull Request und auf main aus.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot installieren
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
      - name: Tests und Rauchtest
        run: tools/test.sh
